<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seijaku Studio</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header class="site-header">

    <a href="index.html" class="logo">
        Seijaku Design
    </a>


    <nav>

        <a href="about.html">
            About
        </a>

    </nav>

</header>





<main>

<section class="gallery">


    <div class="gallery-item" data-project="modular-a">

        <img src="images/modular-a/thumb.webp" alt="Modular A">

        <div class="overlay">
            <h2>Modular A</h2>
        </div>

    </div>





    <div class="gallery-item" data-project="chair-b">

        <img src="images/chair-b/thumb.webp" alt="b Chair">

        <div class="overlay">
            <h2>b Chair</h2>
        </div>

    </div>





    <div class="gallery-item" data-project="table-c">

        <img src="images/table-c/thumb.webp" alt="Table C">

        <div class="overlay">
            <h2>Table C</h2>
        </div>

    </div>


</section>

</main>









<!-- LIGHTBOX -->

<div id="lightbox-overlay">


    <div id="lightbox">


        <button id="close-btn">
            &times;
        </button>





        <!-- LARGE HERO IMAGE / VIDEO -->

        <div id="hero-media">

            <img 
            id="lightbox-image"
            src=""
            alt="">


            <video
            id="lightbox-video"
            muted
            loop
            playsinline>
            </video>

        </div>








        <!-- PROJECT INFORMATION -->

        <div class="project-info">


            <h2 id="lightbox-title"></h2>


            <p id="project-description"></p>




            <div class="details">


                <p>
                    <strong>
                    Material
                    </strong>

                    <br>

                    <span id="project-material"></span>
                </p>




                <p>
                    <strong>
                    Year
                    </strong>

                    <br>

                    <span id="project-year"></span>
                </p>




                <p>
                    <strong>
                    Dimensions
                    </strong>

                    <br>

                    <span id="project-dimensions"></span>
                </p>


            </div>





            <div class="lightbox-links">


                <a id="project-link" href="#">
                    View Project →
                </a>



                <a href="about.html">
                    Contact →
                </a>


            </div>


        </div>









        <!-- ADDITIONAL IMAGES / VIDEOS -->

        <div id="project-media"></div>





    </div>


</div>






<script src="js/lightbox.js"></script>


</body>

</html>
