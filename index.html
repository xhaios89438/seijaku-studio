<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seijaku Studio</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">

    <a href="index.html" class="logo">
        Seijaku Studio
    </a>

    <nav>
        <a href="about.html">About</a>
    </nav>

</header>

<main>

    <section class="gallery">

        <div class="gallery-item"
             data-title="Design 01"
             data-image="images/design-01.png"
             data-link="projects/design-01.html">

            <img src="images/design-01.png" alt="Design 01">

            <div class="overlay">
                <h2>Design 01</h2>
            </div>

        </div>

        <div class="gallery-item"
             data-title="Design 02"
             data-image="images/design-02.png"
             data-link="projects/design-02.html">

            <img src="images/design-02..png" alt="Design 02">

            <div class="overlay">
                <h2>Design 02</h2>
            </div>

        </div>

        <div class="gallery-item"
             data-title="Design 03"
             data-image="images/design-03.png"
             data-link="projects/design-03.html">

            <img src="images/design-03.png" alt="Design 03">

            <div class="overlay">
                <h2>Design 03</h2>
            </div>

        </div>

    </section>

</main>

<div id="lightbox-overlay">

    <div id="lightbox">

        <button id="close-btn">&times;</button>

        <img id="lightbox-image" src="" alt="">

        <h2 id="lightbox-title"></h2>

        <a id="project-link" href="#">
            View Project
        </a>

    </div>

</div>

<script src="js/lightbox.js"></script>

</body>
</html>
